# Weekly dependency updates (design doc section 14.3): pip, npm, Docker and Actions.
# Titles are conventional commits, so they pass the commit-lint job.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      node:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
      - /apps/web/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-tools
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
