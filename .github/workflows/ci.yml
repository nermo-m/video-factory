# Continuous integration (design doc section 14.2). Every job is required to merge.
#
# Each job runs a make target or script that also works on a developer machine, so a red
# job can be reproduced locally with the command shown in its log.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly workflow runs all of these jobs on a schedule.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint-types:
    name: lint-types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Lint Python and JavaScript
        run: make lint
      - name: Type-check Python and TypeScript
        run: make types
      - name: Generated files are current (OpenAPI, API client, progress page)
        run: |
          uv run python -m apps.api.openapi --check
          pnpm --filter web check:api
          node tools/sync-progress.mjs --check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Python unit and contract tests
        run: uv run coverage run -m pytest
        env:
          COVERAGE_FILE: .coverage.unit
      - name: Node tests
        run: pnpm test
      - name: Keep the coverage data for the gate in the integration job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration:
    name: integration
    # The 80 percent line coverage gate (NFR-04) is applied here, on unit and integration
    # coverage together: the queue, the worker and the migrations can only be exercised
    # against a real Postgres.
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: vfs
          POSTGRES_DB: vfs
          # A throwaway database that lives for one job: no password is written anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfs -d vfs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vfs@127.0.0.1:5432/vfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          node: "false"
      - name: Integration tests on real Postgres
        run: uv run coverage run -m pytest -m integration
        env:
          COVERAGE_FILE: .coverage.integration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit
      - name: Coverage gate, 80 percent of lines (NFR-04)
        run: |
          uv run coverage combine .coverage.unit .coverage.integration
          uv run coverage report

  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Golden-frame tests inside the pinned worker image
        run: make render-test
      - name: Upload the frames that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-failed-frames
          path: packages/render/tests/failed/
          if-no-files-found: ignore

  e2e-demo:
    name: e2e-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack in demo mode
        run: make up
      - name: A no-op job travels through the queue and the worker
        run: make noop-job
      - name: Browser tests, and an idea run through the interface to a rendered video
        # demo.spec.ts types an idea, edits the plan, approves it and waits for the render
        # (FR-16). The other tests use axe and compare screenshots at 390, 820 and 1440 px.
        # The voice model is not downloaded in CI, so the bundled narration is used.
        run: make e2e
      - name: Render the sample episode straight from its spec and check the finished file
        run: make demo-render
      - name: Upload the demo video the interface made, and its contact sheet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-video
          path: |
            apps/web/e2e/.demo/video.mp4
            apps/web/e2e/.demo/video_contact_sheet.jpg
          if-no-files-found: error
          # The folder's name starts with a dot.
          include-hidden-files: true
      - name: Collect service logs
        if: always()
        # The browser tests run in a Compose project of their own.
        run: |
          docker compose logs --no-color > compose-logs.txt
          docker compose -p video-factory-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > compose-e2e-logs.txt
      - name: Upload screenshots, traces and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-demo
          path: |
            apps/web/e2e/__screenshots__/
            apps/web/e2e/.results/
            compose-logs.txt
            compose-e2e-logs.txt
          include-hidden-files: true
      # The uploaded video comes from an idea run through the interface. The export pack
      # joins this run in milestone M4.

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit is scanned: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: gitleaks on the whole history
        run: make secret-scan

  asset-licence:
    name: asset-licence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every sample and media file has an ASSETS.md row
        run: python3 scripts/check_assets.py

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Known vulnerabilities in Python and Node packages
        run: make audit

  build-images:
    name: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  commit-lint:
    name: commit-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # On a pull request, check the branch's own commits, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull request commits and title are conventional commits
        if: github.event_name == 'pull_request'
        # The title goes through an environment variable so its text is never run as script.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_commits.py --range "${BASE_SHA}..HEAD" --title "${PR_TITLE}"
      - name: The pushed commit is a conventional commit
        if: github.event_name == 'push'
        run: python3 scripts/check_commits.py --range "HEAD~1..HEAD"
