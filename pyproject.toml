[project]
name = "video-factory"
version = "0.1.0"
description = "Self-hosted studio that turns one idea into a finished short vertical video."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
# One group per container image. Each image installs only its own group.
core = [
    "alembic==1.20.1",
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.8",
    "referencing==0.37.0",
    # Lets jsonschema check the date-time format.
    "rfc3339-validator==0.1.4",
    "sqlalchemy==2.1.8",
]
api = [
    { include-group = "core" },
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
]
worker = [
    { include-group = "core" },
    # The Kokoro voice model runs on ONNX Runtime (packages/adapters/tts).
    # The render engine: frames are drawn with Pillow and NumPy.
    "anthropic==2.8.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "pillow==13.0.0",
]
dev = [
    { include-group = "api" },
    { include-group = "worker" },
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.4",
    "schemathesis==4.33.2",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261111",
]

[tool.uv]
# One virtual project for the whole repository: code is imported from the repository
# root (apps.api, apps.worker, packages.*), nothing is built or published.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "UP",  # modern syntax
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RET", # return statements
    "S",   # security (bandit)
    "T20", # no print statements
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements: that is how pytest works.
"**/tests/**" = ["S101"]
# Migrations spell out constraint SQL in full. Wrapping those strings would make them
# harder to compare with the database, so the line length rule is off for them.
"packages/core/db/migrations/versions/*" = ["E501"]
# The voice adapter works with phonemes, which are written in the International Phonetic
# Alphabet, and with typographic punctuation in narration. Those characters are the data,
# so the "looks like another character" rule is off for these files.
"packages/adapters/tts/*" = ["RUF001"]
"packages/adapters/tests/test_tts_*" = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
files = ["apps/api", "apps/worker", "packages", "scripts", "tools", "tests", "conftest.py"]

[[tool.mypy.overrides]]
# ONNX Runtime ships no type information. It is imported in one place, the Kokoro voice
# adapter, behind a typed Protocol.
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.coverage.run]
# NFR-04: 80 percent line coverage on apps/api, apps/worker and packages/. The host
# bridge is held to the same gate.
source = ["apps/api", "apps/worker", "packages", "tools/cli_bridge"]
omit = [
    "*/tests/*",
    # Generated schema definitions, exercised by the migration tests as a whole.
    "packages/core/db/migrations/versions/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config -m \"not integration and not render and not voice and not host_tools\""
markers = [
    "integration: needs a real Postgres. Run with make test-integration",
    "render: golden-frame and audio tests that run inside the worker image",
    "voice: the real Kokoro voice. Needs the model files. Run with make voice-test",
    "host_tools: asks the installed claude and codex programs whether they accept the bridge's flags. No model call. Run with make bridge-flags",
]
pythonpath = ["."]
testpaths = ["apps", "packages", "scripts", "tools", "tests"]
xfail_strict = true
