[project]
name = "video-factory"
version = "0.1.0"
description = "Self-hosted studio that turns one idea into a finished short vertical video."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
# One group per container image. Each image installs only its own group.
core = [
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "sqlalchemy==2.1.8",
]
api = [
    { include-group = "core" },
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
]
worker = [
    { include-group = "core" },
]
dev = [
    { include-group = "api" },
    { include-group = "worker" },
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.4",
    "types-pyyaml==6.0.12.20261111",
]

[tool.uv]
# One virtual project for the whole repository: code is imported from the repository
# root (apps.api, apps.worker, packages.*), nothing is built or published.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "UP",  # modern syntax
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RET", # return statements
    "S",   # security (bandit)
    "T20", # no print statements
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements: that is how pytest works.
"**/tests/**" = ["S101"]
# Migrations spell out constraint SQL in full. Wrapping those strings would make them
# harder to compare with the database, so the line length rule is off for them.
"packages/core/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
files = ["apps/api", "apps/worker", "packages", "scripts", "tests", "conftest.py"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config -m \"not integration\""
markers = [
    "integration: needs a real Postgres. Run with make test-integration",
]
pythonpath = ["."]
testpaths = ["apps", "packages", "scripts", "tests"]
xfail_strict = true
