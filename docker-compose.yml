# Video Factory Studio, local stack. Copy .env.example to .env first (`make up` does it).
#
# Every published port binds to 127.0.0.1 only (NFR-02). ComfyUI and the CLI bridge run on
# the host and are reached at host.docker.internal (D3). Data lives in named volumes (D9).
name: video-factory

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vfs}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vfs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vfs}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The api applies database migrations before it reports healthy.
      api:
        condition: service_healthy
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vfs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vfs}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CRITIC_ENABLED: ${CRITIC_ENABLED:-true}
      KOKORO_MODEL_PATH: /models/kokoro/kokoro.onnx
      KOKORO_VOICES_PATH: /models/kokoro/voices.bin
    volumes:
      - app-data:/data
      # Voice model files from `make models`. Without them the bundled sample voice is used.
      - models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db-data:
  app-data:
  models:
