# Browser tests, against a stack of their own. Used on top of docker-compose.yml, as its
# own Compose project:
#
#   docker compose -p video-factory-e2e -f docker-compose.yml -f docker-compose.e2e.yml ...
#
# `make e2e` does this, and `make e2e-update` rewrites the approved screenshots.
#
# The project name gives the tests their own containers, network and volumes, so they
# never write into the database the owner uses. `make e2e` also gives the stack its own
# ports on 127.0.0.1 (DB_HOST_PORT, API_HOST_PORT, WEB_HOST_PORT), so it runs next to the
# owner's stack. It is always in demo mode, whatever .env says, so it cannot spend plan
# usage.
services:
  api:
    environment:
      PROVIDER_MODE: demo
  worker:
    environment:
      PROVIDER_MODE: demo
  e2e:
    build:
      context: .
      dockerfile: apps/web/e2e/Dockerfile
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      BASE_URL: http://web:3000
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    volumes:
      # Approved screenshots are read from, and with --update-snapshots written to, the
      # repository. Failure traces land in a folder that git ignores.
      - ./apps/web/e2e/__screenshots__:/repo/apps/web/e2e/__screenshots__
      - ./apps/web/e2e/.results:/repo/apps/web/e2e/.results
      # The video the end to end demo test made, for CI to upload (demo.spec.ts).
      - ./apps/web/e2e/.demo:/repo/apps/web/e2e/.demo
